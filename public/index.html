<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pet Friendly Places</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .place { border: 1px solid #ccc; padding: 10px; margin: 10px; }
    img { max-width: 200px; display: block; margin-top: 5px; }
  </style>
</head>
<body>
<h1>Pet Friendly Places</h1>
<div id="places"></div>
<h2>Add Place</h2>
<form id="placeForm">
  <input type="text" id="placeName" placeholder="Place name" required>
  <input type="text" id="placeDesc" placeholder="Description" required>
  <button type="submit">Add</button>
</form>
<script>
async function loadPlaces() {
  const res = await fetch('/api/places');
  const data = await res.json();
  const container = document.getElementById('places');
  container.innerHTML = '';
  data.places.forEach(p => {
    const div = document.createElement('div');
    div.className = 'place';
    div.innerHTML = `<h3>${p.name}</h3><p>${p.description}</p>`;
    if (p.photos) {
      p.photos.forEach(photo => {
        const img = document.createElement('img');
        img.src = photo;
        div.appendChild(img);
      });
    }
    const commentList = document.createElement('ul');
    if (p.comments) {
      p.comments.forEach(c => {
        const li = document.createElement('li');
        li.textContent = c;
        commentList.appendChild(li);
      });
    }
    div.appendChild(commentList);
    const commentForm = document.createElement('form');
    commentForm.innerHTML = '<input type="text" placeholder="Add comment" required><button>Add</button>';
    commentForm.onsubmit = async e => {
      e.preventDefault();
      const text = commentForm.querySelector('input').value;
      await fetch(`/api/places/${p.id}/comments`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
      loadPlaces();
    };
    div.appendChild(commentForm);
    const photoForm = document.createElement('form');
    photoForm.innerHTML = '<input type="file" accept="image/*" required><button>Upload</button>';
    photoForm.onsubmit = async e => {
      e.preventDefault();
      const file = photoForm.querySelector('input').files[0];
      const reader = new FileReader();
      reader.onload = async function() {
        await fetch(`/api/places/${p.id}/photos`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: reader.result }) });
        loadPlaces();
      };
      reader.readAsDataURL(file);
    };
    div.appendChild(photoForm);
    container.appendChild(div);
  });
}
loadPlaces();

document.getElementById('placeForm').onsubmit = async e => {
  e.preventDefault();
  const name = document.getElementById('placeName').value;
  const description = document.getElementById('placeDesc').value;
  await fetch('/api/places', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, description }) });
  document.getElementById('placeName').value = '';
  document.getElementById('placeDesc').value = '';
  loadPlaces();
};
</script>
</body>
</html>
